  <!-- film body -->
  <rect x="8" y="15" width="32" height="20" rx="2.5" fill="#0a0a0a"/>
  <!-- clapperboard top bar -->
  <rect x="8" y="14" width="32" height="5" rx="2" fill="#1a1a1a"/>
  <!-- hinge teeth -->
  <rect x="11" y="9" width="4" height="8" rx="1.5" fill="#1a1a1a"/>
  <rect x="19" y="9" width="4" height="5" rx="1.5" fill="#1a1a1a" opacity="0.45"/>
  <rect x="27" y="9" width="4" height="5" rx="1.5" fill="#1a1a1a" opacity="0.45"/>
  <rect x="33" y="9" width="4" height="8" rx="1.5" fill="#1a1a1a"/>
  <!-- play triangle -->
  <path d="M21 26.5l7.5-3.5-7.5-3.5v7z" fill="#ffffff"/>
