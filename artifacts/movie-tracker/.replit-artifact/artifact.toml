kind = "web"
previewPath = "/"
title = "Indian Cinema Tracker"
version = "1.0.0"
id = "artifacts/movie-tracker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18645

[services.development]
run = "pnpm --filter @workspace/movie-tracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/movie-tracker", "run", "build" ]
serve = "static"
publicDir = "artifacts/movie-tracker/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18645"
BASE_PATH = "/"
# Replit API artifact listens on 8080 (see api-server/.replit-artifact).
# Without this, Vite's /api proxy defaults to :5000 and posters/auth calls fail.
API_PROXY_TARGET = "http://127.0.0.1:8080"
